<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如意管家</title>
<style>
/* ============================================================
   如意 Ruyi · 第 115 波纸面原型 —— 管家壳（极简版 v3）
   依据：docs/optimization-plan/27-waves-115-117-steward.md §8、§3.1 116g/116h
   v3 变化：单一「权限」档（去掉线程级自治档位）；管家自己判断是否直接回答（无「速问」标签）；
   抽屉先给「它刚说」与「你可以说」，再给三问；宽屏右侧常驻「现在这一件」；
   头像可跟着话走；每次打开只汇报本次，上次对话不显示。
   token 对齐 app/public/css/tokens.css；零依赖、零 innerHTML。
   ============================================================ */
:root{
  font-size:15px;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,"PingFang SC",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --fs-xs:.8rem;--fs-sm:.87rem;--fs-base:1rem;--fs-lg:1.13rem;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --ease-out:cubic-bezier(.2,.7,.3,1);--dur-fast:120ms;--dur-base:200ms;--dur-slow:320ms;
  color-scheme:dark;
  --panel:#141a29;--panel-2:#182031;--panel-3:#202a40;
  --ink:#eef1f8;--ink-2:#c9d2e4;--muted:#8b9cb8;--line:#222c42;--line-2:#303d59;
  --accent:#6e86f2;--accent-hover:#8497f8;--accent-ink:#fff;--accent-soft:#1a2440;--accent-2:#9a72f0;
  --gold:#dcba75;--gold-soft:#2c2413;--danger:#e06a66;--danger-soft:#3a1f22;--ok:#5cc093;--ok-soft:#173327;--info:#6b9ef0;
  --scene-bg:
    radial-gradient(1080px 620px at 88% -14%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 64%),
    radial-gradient(840px 520px at -10% 112%, color-mix(in srgb,var(--accent-2) 9%,transparent), transparent 62%),
    linear-gradient(160deg,#090d16 0%,#0b1120 48%,#0e1526 100%);
  --glass-bg-1:rgba(146,166,214,.065);--glass-bg-2:rgba(158,178,224,.085);--glass-bg-3:rgba(140,160,208,.05);
  --glass-border:rgba(180,200,240,.09);--glass-border-strong:rgba(190,208,248,.15);
  --glass-highlight:inset 0 1px 0 rgba(210,225,255,.08);
  --glass-shadow:0 24px 60px rgba(2,6,16,.55);--glass-shadow-soft:0 10px 30px rgba(2,6,16,.35);
  --glass-blur:blur(16px) saturate(1.3);
  --ring:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);
  --gold-line:color-mix(in srgb,var(--gold) 55%,transparent);
  --shade:rgba(4,8,18,.5);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --panel:#fff;--panel-2:#f7f9fc;--panel-3:#eef2f8;
    --ink:#1a2334;--ink-2:#33405a;--muted:#5d6a84;--line:#dbe2ee;--line-2:#c6d1e3;
    --accent:#2050c8;--accent-hover:#1a43ab;--accent-ink:#fff;--accent-soft:#e7edfa;--accent-2:#7a5fd0;
    --gold:#a8822f;--gold-soft:#f6edd8;--danger:#b42318;--danger-soft:#fbe4e1;--ok:#22794e;--ok-soft:#e0f3e8;--info:#2b6cb0;
    --scene-bg:
      radial-gradient(980px 540px at 88% -12%, color-mix(in srgb,var(--accent) 8%,transparent), transparent 62%),
      radial-gradient(800px 500px at -8% 112%, color-mix(in srgb,var(--accent-2) 5%,transparent), transparent 60%),
      linear-gradient(158deg,#f6f8fc 0%,#eef2f9 48%,#e9eef8 100%);
    --glass-bg-1:rgba(255,255,255,.58);--glass-bg-2:rgba(255,255,255,.72);--glass-bg-3:rgba(255,255,255,.46);
    --glass-border:rgba(20,28,48,.09);--glass-border-strong:rgba(20,28,48,.14);
    --glass-highlight:inset 0 1px 0 rgba(255,255,255,.75);
    --glass-shadow:0 18px 50px rgba(20,28,48,.15);--glass-shadow-soft:0 8px 28px rgba(20,28,48,.09);
    --gold-line:color-mix(in srgb,var(--gold) 60%,transparent);
    --shade:rgba(20,28,48,.3);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --panel:#fff;--panel-2:#f7f9fc;--panel-3:#eef2f8;
  --ink:#1a2334;--ink-2:#33405a;--muted:#5d6a84;--line:#dbe2ee;--line-2:#c6d1e3;
  --accent:#2050c8;--accent-hover:#1a43ab;--accent-ink:#fff;--accent-soft:#e7edfa;--accent-2:#7a5fd0;
  --gold:#a8822f;--gold-soft:#f6edd8;--danger:#b42318;--danger-soft:#fbe4e1;--ok:#22794e;--ok-soft:#e0f3e8;--info:#2b6cb0;
  --scene-bg:
    radial-gradient(980px 540px at 88% -12%, color-mix(in srgb,var(--accent) 8%,transparent), transparent 62%),
    radial-gradient(800px 500px at -8% 112%, color-mix(in srgb,var(--accent-2) 5%,transparent), transparent 60%),
    linear-gradient(158deg,#f6f8fc 0%,#eef2f9 48%,#e9eef8 100%);
  --glass-bg-1:rgba(255,255,255,.58);--glass-bg-2:rgba(255,255,255,.72);--glass-bg-3:rgba(255,255,255,.46);
  --glass-border:rgba(20,28,48,.09);--glass-border-strong:rgba(20,28,48,.14);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,.75);
  --glass-shadow:0 18px 50px rgba(20,28,48,.15);--glass-shadow-soft:0 8px 28px rgba(20,28,48,.09);
  --gold-line:color-mix(in srgb,var(--gold) 60%,transparent);
  --shade:rgba(20,28,48,.3);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass-bg-1:var(--panel);--glass-bg-2:var(--panel-2);--glass-bg-3:var(--panel-2);}
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--scene-bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;border-radius:var(--r-sm)}
input,select,textarea{font:inherit;color:var(--ink)}
:where(button,[tabindex],input,select,textarea):focus-visible{outline:none;box-shadow:var(--ring)}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:var(--mono);font-size:.92em}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,140,175,.3);border-radius:6px}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.d{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.d.running{background:var(--accent)}.d.needs_you{background:var(--gold)}.d.stopped{background:var(--danger)}.d.done{background:var(--ok)}

/* ── 演示条（不入产品体系）── */
.demo{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 14px;
  background:var(--glass-bg-2);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border);font-size:var(--fs-xs);color:var(--muted)}
.demo .tag{padding:2px 9px;border-radius:var(--r-pill);background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line);font-weight:600}
.demo label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.demo select,.demo .tb{padding:3px 9px;border-radius:var(--r-pill);background:var(--glass-bg-3);border:1px solid var(--glass-border);color:var(--ink);font-size:var(--fs-xs)}
.demo .grow{flex:1}

/* ── 骨架 ── */
.wrap{display:flex;justify-content:center;padding:14px}
.app{position:relative;display:flex;width:min(1280px,100%);height:calc(100vh - 70px);min-height:600px;
  border:1px solid var(--glass-border);border-radius:var(--r-lg);overflow:hidden;
  background:var(--glass-bg-1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-highlight),var(--glass-shadow)}
.app.phone{width:390px;height:800px;min-height:0;border-radius:30px;border:6px solid var(--panel-3)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column}
.col{width:100%;max-width:800px;margin:0 auto}

/* ── 头部：头像（默认在这里；「跟话走」时移到最新一句旁）· 名字 · 一行状态 ── */
.head{display:flex;align-items:center;gap:14px;padding:18px 24px 10px}
.app.phone .head{padding:14px 16px 8px}
.app.follow #avhome{display:none}
.app.follow .head{padding-top:14px}
.who{flex:1;min-width:0}
.who .name{font-weight:700;font-size:var(--fs-lg);line-height:1.2}
.status{display:flex;align-items:center;gap:6px;max-width:100%;color:var(--muted);font-size:var(--fs-sm);text-align:left;border-radius:var(--r-pill);padding:2px 8px 2px 0;margin-left:-2px}
.status:hover{color:var(--ink-2)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.status .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .chev{opacity:.6}
.app[data-state="waiting_you"] .status .dot{background:var(--gold)}
.app[data-state="working"] .status .dot,.app[data-state="thinking"] .status .dot{background:var(--accent)}
.app[data-state="error"] .status .dot{background:var(--danger)}
.ctl{display:flex;gap:4px;align-items:center;position:relative}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:all var(--dur-fast) var(--ease-out)}
.ib:hover{color:var(--ink);border-color:var(--glass-border-strong);background:var(--glass-bg-2)}
.ib.perm[data-perm="改文件不问"]{color:var(--accent)}
.ib.perm[data-perm="全自动"]{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}
.ib.stop:hover{color:var(--danger)}
.ib.stop.asleep{color:var(--ok)}
.menu{position:absolute;z-index:34;min-width:200px;padding:6px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--glass-border-strong);box-shadow:var(--glass-shadow)}
.menu.right{top:40px;right:0}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);white-space:nowrap}
.menu button:hover{background:var(--panel-3)}
.menu button[aria-checked="true"]{background:var(--accent-soft)}
.menu .k{margin-left:auto;color:var(--muted);font-size:var(--fs-xs);font-family:var(--mono)}
.menu .opt{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;width:280px;white-space:normal}
.menu .opt small{grid-column:2;color:var(--muted);font-size:var(--fs-xs);line-height:1.35}
.menu .hd{padding:4px 10px 6px;font-size:var(--fs-xs);color:var(--muted)}

/* ── avatar：圆＋环＋一对眼睛（§8.3） ── */
.avatar{width:56px;height:56px;flex:none;border-radius:50%;padding:0;display:block}
.avslot .avatar{width:36px;height:36px}
.avatar svg{width:100%;height:100%;overflow:visible}
.av-body,.av-ring,.av-eye,.av-sat,.av-eyes{transform-box:fill-box;transform-origin:center}
.av-body{fill:url(#avg);transition:fill var(--dur-fast)}
.av-ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:.85;transition:stroke var(--dur-fast),opacity var(--dur-base),transform var(--dur-base) var(--ease-out)}
.av-eye{fill:#fff;transition:transform var(--dur-base) var(--ease-out)}
.av-sat{fill:var(--muted)}.av-sat.running{fill:var(--accent)}.av-sat.needs_you{fill:var(--gold)}.av-sat.stopped{fill:var(--danger)}.av-sat.done{fill:var(--ok)}
.avatar[data-state="idle"] .av-body{animation:breathe 4s ease-in-out infinite}
.avatar[data-state="idle"] .av-eyes,.avatar[data-state="listening"] .av-eyes,.avatar[data-state="thinking"] .av-eyes,.avatar[data-state="working"] .av-eyes{animation:blink 5.2s infinite}
.avatar[data-state="listening"] .av-ring{transform:scale(1.07);opacity:1}
.avatar[data-state="listening"] .av-eye{transform:translateY(1.6px) scaleY(1.15)}
.avatar[data-state="thinking"] .av-ring{stroke-dasharray:4 7;animation:flow 1.2s linear infinite}
.avatar[data-state="working"] .av-ring{stroke-dasharray:70 206;animation:spin .9s linear infinite}
.avatar[data-state="working"] .av-body{animation:bob .9s ease-in-out infinite}
.avatar[data-state="working"] .av-eye{transform:translateX(2px)}
.avatar[data-state="waiting_you"] .av-ring{stroke:var(--gold);stroke-dasharray:232 44;stroke-dashoffset:-22;transform:rotate(-90deg);opacity:1}
.avatar[data-state="waiting_you"] .av-body{fill:url(#avg-gold)}
.avatar[data-state="waiting_you"].pulse .av-ring{animation:pulse .3s var(--ease-out) 1}
.avatar[data-state="error"] .av-body{fill:url(#avg-red)}
.avatar[data-state="error"] .av-ring{stroke:var(--danger)}
.avatar[data-state="error"].shake{animation:shake .4s var(--ease-out) 1}
.avatar[data-state="sleeping"]{filter:saturate(.15);opacity:.55}
.avatar[data-state="sleeping"] .av-ring,.avatar[data-state="sleeping"] .av-sat{opacity:0}
.avatar[data-state="sleeping"] .av-eye{transform:scaleY(.12)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes pulse{0%{transform:rotate(-90deg) scale(1)}50%{transform:rotate(-90deg) scale(1.12)}100%{transform:rotate(-90deg) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.avatar *,.avatar{animation:none!important;transition:none!important}}
html.rm *{transition:none!important;animation:none!important}

/* ── 快切 chip：权限 / 模型 / 引擎（线程级，看板、抽屉、2.0 顶栏共用）── */
.qcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--glass-border);background:transparent;white-space:nowrap;font-weight:400}
.qc:hover{color:var(--ink);border-color:var(--glass-border-strong)}
.qc b{font-weight:600;color:var(--ink-2)}
.qc .chev{opacity:.5;width:.8em;height:.8em}
.qc.full b{color:var(--gold)}

/* ── 看板：从状态行下拉的一张纸（§8.10，按事项分组）── */
.sheet{position:absolute;left:0;right:0;top:84px;z-index:28;margin:0 24px;max-height:66%;overflow:auto;
  background:var(--panel);border:1px solid var(--glass-border-strong);border-radius:var(--r-md);box-shadow:var(--glass-shadow);padding:6px 6px 10px}
.app.follow .sheet{top:70px}
.app.phone .sheet{margin:0 8px;top:78px}
.sheet-top{display:flex;align-items:center;gap:12px;padding:6px 10px 8px;font-size:var(--fs-xs);color:var(--muted);flex-wrap:wrap}
.sheet-top input{width:40px;padding:1px 4px;border-radius:var(--r-sm);border:1px solid var(--glass-border-strong);background:var(--panel-2);text-align:center}
.sheet-top .grow{flex:1}
.sheet-top button{color:var(--muted)}
.sheet-top button:hover{color:var(--ink)}
.mh{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--glass-border);margin-top:4px;flex-wrap:wrap}
.mh.first{border-top:0;margin-top:0}
.mh b{color:var(--ink);font-weight:700;font-size:var(--fs-sm)}
.mh .grow{flex:1}
.mh button{color:var(--muted);font-size:var(--fs-xs)}
.mh button:hover{color:var(--ink)}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;align-items:center;padding:7px 10px 7px 16px;border-radius:var(--r-sm);font-size:var(--fs-sm)}
.row:hover{background:var(--panel-2)}
.row .d{grid-column:1;grid-row:1/3}
.row .t{grid-column:2;grid-row:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.row .t .meta{font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.row .s{grid-column:2;grid-row:2;color:var(--muted);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.wait{color:var(--gold)}
.row .ops{grid-column:3;grid-row:1/3;display:flex;gap:2px;opacity:0;transition:opacity var(--dur-fast)}
.row:hover .ops,.row:focus-within .ops,.app.phone .row .ops{opacity:1}
.row .ops button{padding:2px 7px;font-size:var(--fs-xs);color:var(--muted);border-radius:var(--r-sm);white-space:nowrap}
.row .ops button:hover{color:var(--ink);background:var(--panel-3)}
.st{display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;line-height:1.6}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.running{color:var(--accent);background:var(--accent-soft)}
.st.needs_you{color:var(--gold);background:var(--gold-soft)}
.st.done{color:var(--ok);background:var(--ok-soft)}
.st.stopped{color:var(--danger);background:var(--danger-soft)}
.st.dispatching{color:var(--muted);background:var(--panel-3)}

/* ── 对话 ── */
.chat{flex:1;overflow:auto;padding:6px 24px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.app.phone .chat{padding:6px 16px 12px}
.m{max-width:680px}
.m.user{align-self:flex-end;background:var(--accent-soft);border-radius:16px 16px 4px 16px;padding:8px 14px;max-width:520px}
.m.steward{align-self:flex-start;display:flex;gap:10px;align-items:flex-start;width:100%}
.m.steward .avslot{display:none;width:36px;height:36px;flex:none}
.app.follow .m.steward .avslot{display:block}
.m.steward .body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.m.steward .say{line-height:1.65;padding-top:4px}
.m.steward.pending .say{color:var(--muted);letter-spacing:2px}
.m.steward ul{margin:0;padding-left:18px;color:var(--ink-2);display:grid;gap:2px}
.m.sys{align-self:center;color:var(--muted);font-size:var(--fs-xs);padding:0 10px}
.mark{display:inline-grid;place-items:center;width:15px;height:15px;margin:0 3px;border-radius:50%;font-size:10px;color:var(--muted);border:1px solid var(--line-2);vertical-align:.15em;cursor:pointer}
.mark:hover{color:var(--accent);border-color:var(--accent)}
.why{position:absolute;z-index:36;max-width:320px;padding:8px 10px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--glass-border-strong);box-shadow:var(--glass-shadow-soft);font-size:var(--fs-xs);color:var(--ink-2);line-height:1.5}
.trace{display:none;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);padding:4px 10px;border-left:2px solid var(--line-2);white-space:pre-wrap}
.app.details .trace{display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts.settled{color:var(--muted);font-size:var(--fs-xs)}
.acts.settled.ok{color:var(--ok)}
.b{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;
  border:1px solid var(--glass-border-strong);background:var(--glass-bg-2);color:var(--ink);transition:all var(--dur-fast) var(--ease-out)}
.b:hover{transform:translateY(-1px);border-color:var(--accent)}
.b.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.b.primary:hover{background:var(--accent-hover)}
.b.gold{background:var(--gold);color:#1a1404;border-color:transparent}
.b.quiet{background:transparent;color:var(--muted);border-color:transparent;font-weight:500}
.b.quiet:hover{color:var(--ink);border-color:var(--glass-border-strong)}
.b.sm{height:26px;padding:0 10px;font-size:var(--fs-xs)}
.b .chev{width:.8em;height:.8em;opacity:.6}
.note{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--muted);padding:3px 0}
.app.follow .note{margin-left:46px}
.note b{color:var(--ink-2);font-weight:500}
.note button{color:var(--accent);font-size:var(--fs-xs)}
.note .ok{color:var(--ok)}

/* ───────── 管家回合 ───────── */
async function turn(fn,o){o=o||{};if(S.sleeping){S.queue.push(fn);msgSys('已停机，这件事先记在收件箱');return;}

  if(o.working){S.stewardTurn='working';S.workingOn=o.working;renderHead();await sleep(700);}
  await fn();clearPending();S.stewardTurn=null;S.workingOn=null;renderHead();}
function routeText(text){const l=text.toLowerCase();const rules=[
  {id:'t1',kw:['周报','销售表','销售','汇总'],reason:'记忆「每周一交周报」＋标题命中「周报」'},{id:'t2',kw:['下载','整理','文件夹','归档'],reason:'提到下载文件夹，该线程正在整理它'},
  {id:'t3',kw:['拆分','重构','workflow','模块'],reason:'当前关注「项目 A 重构」'},{id:'t5',kw:['合同','翻译'],reason:'标题命中「合同」'},{id:'t6',kw:['竞品','价格','爬'],reason:'标题命中「竞品」'}];
  return rules.map(r=>({...r,n:r.kw.filter(k=>l.includes(k)).length})).filter(r=>r.n).sort((a,b)=>b.n-a.n).slice(0,2);}
const isSchedule=t=>/提醒|每天|每周|每月|定时|明天.*点|后天|(\d+|[一二三四五六七八九十]+)\s*点/.test(t);

function answer(text){
  const c=counts();const top=[...S.threads].sort((a,b)=>b.cost-a.cost)[0];const total=S.threads.reduce((a,t)=>a+t.cost,0);
  if(/烧钱|费用|花|多少钱|成本/.test(text))return [`最烧钱的是「${top.title}」，$${top.cost.toFixed(2)}，班组 3/5 在跑。今天一共 $${total.toFixed(2)}，离你设的 $5 上限还早。`,{mark:'来自 steward_usage(day)：按线程汇总本日费用'}];
  if(/几条|哪些|有什么|在干|进度|怎么样/.test(text))return [`${Object.keys(MISSIONS).length} 个事项，${c.running} 条在跑、${c.waiting} 条在等、${c.needs_you} 条等你。最要紧的是「翻译合同」，它在等你允许写入。`,{mark:'来自看板聚合；点状态行可展开'}];

/* 递话（§8.12）：输入时就预判递送目标，Enter 直接递；递出后一行回执，10 秒内可撤回，之后可换一条 */
function preRoute(text){
  text=(text||'').trim();if(!text)return {kind:'steward'};
  if(isSchedule(text))return {kind:'schedule'};
  const hits=routeText(text);
  if(hits.length&&(hits.length===1||hits[0].n>hits[1].n))return {kind:'thread',thread:T(hits[0].id),hits};
  if(hits.length)return {kind:'unsure',hits};
  if(isQuestion(text))return {kind:'question'};
  return {kind:'new'};}
function renderTo(){const chip=$('#to-chip');const txt=$('#to-txt');
  if(S.target){txt.textContent='→ '+T(S.target).title;chip.className='to pinned';return;}
  const r=preRoute($('#input').value);S.pre=r;
  txt.textContent=r.kind==='thread'?'→ '+r.thread.title:r.kind==='schedule'?'→ 如意 · 定时':r.kind==='unsure'?'→ 如意 · 会问你':r.kind==='new'?'→ 如意 · 另起一件':'→ 如意';
  chip.className='to'+(r.kind==='thread'?' thread':'');}
function pickTarget(anchor){const items=[{label:'如意（回答，或替你判断）',checked:!S.target,on:()=>{S.target=null;renderTo();$('#input').focus();}}];
  for(const mid in MISSIONS){sibs(mid).filter(x=>x.state!=='done').forEach(x=>items.push({label:MISSIONS[mid].title+' / '+x.title,checked:S.target===x.id,on:()=>{S.target=x.id;renderTo();$('#input').focus();}}));}

function altItems(text,from,row,revert){const items=[];const seen=new Set([from&&from.id]);

  if(from)sibs(from.mission).filter(x=>x.state!=='done').forEach(add);routeText(text).forEach(h=>add(T(h.id)));
  if(from)items.push({label:'在「'+MISSIONS[from.mission].title+'」下新开一条',on:()=>{revert&&revert();settle(row,true,'已在事项下新开');newThread(text,from.mission);}});

  continueThread(t,text);

  await turn(async()=>{const t=newThread(text);const row=acts('');const M=MISSIONS[t.mission];

  },{think:600});

function toast(text){document.querySelectorAll('.toast').forEach(n=>n.remove());const t=el('div',{class:'toast',role:'status'},text);$('#app').append(t);setTimeout(()=>t.remove(),2400);}
function openPalette(mode){const list=el('div',{class:'list'});const inp=el('input',{type:'text',placeholder:mode==='target'?'发给哪条线程？':'找线程…','aria-label':'找线程'});
  const paint=()=>{while(list.firstChild)list.removeChild(list.firstChild);const q=inp.value.trim().toLowerCase();S.threads.filter(t=>!q||(t.title+t.action+MISSIONS[t.mission].title).toLowerCase().includes(q)).forEach((t,i)=>list.append(el('button',{type:'button',class:i===0?'on':'',onclick:()=>{closePanel();if(mode==='target'){S.target=t.id;renderTo();$('#input').focus();}else openDrawer(t.id);}},el('span',{class:'st '+t.state},STATE_LABEL[t.state]),el('span',{},MISSIONS[t.mission].title,' / ',t.title,' ',el('small',{},'· '+t.action)))));};
  inp.addEventListener('input',paint);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const x=list.querySelector('button');if(x)x.click();}});
  overlay(el('div',{class:'shade',onclick:e=>{if(e.target.classList.contains('shade'))closePanel();}},el('div',{class:'palette',role:'dialog'},inp,list)));paint();}
function popMenu(host,items){const off=e=>{if(!host.contains(e.target)){host.classList.add('hidden');document.removeEventListener('click',off,true);}};while(host.firstChild)host.removeChild(host.firstChild);items.forEach(i=>host.append(i));host.classList.remove('hidden');setTimeout(()=>document.addEventListener('click',off,true),0);}

/* ───────── 每次打开只汇报本次：上次对话归档，不显示 ───────── */
function visit(first){
  const c=chat();while(c.firstChild)c.removeChild(c.firstChild);
  const h=now().getHours();const greet=h<11?'早。':h<14?'中午好。':h<18?'下午好。':'晚上好。';
  const items=[];S.threads.forEach(t=>{if(t.state==='needs_you')items.push(`「${t.title}」等你：${t.pending?t.pending.text.replace(/^写入/,'要不要允许写入'):'拿主意'}`);else if(t.state==='running')items.push(`「${t.title}」${t.action}`);else if(t.state==='stopped'&&t.error)items.push(`「${t.title}」失败：${t.error}。重试过一次，还是不行`);else if(t.state==='done'&&t.justDone)items.push(`「${t.title}」收工了`);});
  const focus=focusThread();const row=acts('',b('打开「'+focus.title+'」','',()=>openDrawer(focus.id),IC.open),b('知道了','quiet',()=>settle(row,true,'知道了')));
  msgSteward([greet+(first?'你不在的 11 小时里':'你离开的这会儿')+`有 ${items.length} 件事：`],{list:items.slice(0,5),acts:row,trace:['steward_inbox_read(since=cursor) → digest','上次对话已归档到行动流水，不再展示']});
  const t5=T('t5');
  if(t5.state==='needs_you')propose({say:['「翻译合同」想写入 合同-EN.docx。我看过差异，只替换译文，没删东西。'],okLabel:'允许',why:'事件 #4821 permission_request(edit) · 写 1 个文件，检查点 #c52 可整单回退 · 因为你 9月1日 说过「合同类文件改动前要先看差异」，所以我先看了差异 · 线程是「每步都问」，写文件只提议',trace:['inbox seq=4821 edit thread=t5','memory.use(k3)','steward_thread_status(t5) → diff 38 replace / 0 delete','thread.perm=每步都问 → propose'],
    onApprove:()=>{t5.state='running';t5.pending=null;t5.action='正在写入 合同-EN.docx';t5.say='写回中，逐条替换译文。';t5.replies=null;t5.startedAt=Date.now();t5.lastOut=Date.now();renderAll();afterEdit(t5);},onReject:()=>{t5.state='stopped';t5.pending=null;t5.action='你拒绝了写入';renderAll();}});
  if(first)msgSteward(['其它的都在跑。想做什么直接说，问我也行。'],{acts:acts('',...['把上周的销售表整理成周报，华南的表我放到 下载 里了','明天 9 点提醒我交周报','现在哪条最烧钱'].map(x=>b(x,'quiet',()=>{$('#input').value=x;renderTo();$('#input').focus();})))});
}
async function play(){const text='把上周的销售表整理成周报，华南的表我放到 下载 里了';const inp=$('#input');inp.value='';S.typing=true;renderHead();for(const ch of text){inp.value+=ch;renderTo();await sleep(36);}await sleep(900);S.typing=false;inp.value='';await handleUserMessage(text);}
function simulate(k){switch(k){
  case 'question':inbox({kind:'question',threadId:'t2',seq:4844});break;
  case 'fail':inbox({kind:'failed',threadId:'t3',seq:4845,error:'审核员节点超时（120 秒）'});break;
  case 'done':inbox({kind:'done',threadId:'t2',seq:4846,summary:'380 个文件按月份归档完毕。',items:['41 个重复文件移到 回收，可回退','本次 $0.14']});break;
  case 'relay':inbox({kind:'relay',threadId:'t1',to:'t8',seq:4839});break;
  case 'schedule':turn(async()=>{const row=acts('',b('打开','',()=>openDrawer('t1'),IC.open),b('暂停这条任务','quiet',()=>settle(row,false,'已暂停')));msgSteward(['到点了：「每个工作日 18:00 生成周报草稿」。我在「本周周报」事项里新开了一条线程，要动文件时会先问你。'],{acts:row});},{think:600});break;
  case 'serror':S.stewardError='端点 503';renderHead();msgSys('管家自身出错：端点 503。线程不受影响；候选退化为词法匹配，提议退化为原始事件通知。');setTimeout(()=>{S.stewardError=null;renderHead();},6000);break;
  case 'habit':turn(async()=>{propose({say:['今天周一，你通常这会儿整理上周的销售表。要我先把「周报-W36」叫醒，等华南的表出现？'],okLabel:'好',why:'来自习惯：归纳自 8月11日 / 18日 / 25日 三次会话 · 不动文件，只把线程置为进行中并监听文件夹 · 主动建议每天最多一条，可永久关闭',onApprove:()=>{const t=T('t1');t.state='running';t.action='等 下载/华南-销售.xlsx 出现';t.startedAt=Date.now();t.lastOut=Date.now();renderAll();}});},{think:600});break;}}

/* ───────── 绑定 ───────── */
function renderAll(){applyConcurrency();if(S.dock&&!S.dockDismissed&&S.drawer&&!S.phone){const f=focusThread();if(f.state==='needs_you'&&S.drawer!==f.id)S.drawer=f.id;}renderHead();if(S.drawer)renderDrawer();else autoDock();if($('#sheet-host').firstChild)toggleSheet(true);}
function bind(){
  const inp=$('#input');
  inp.addEventListener('input',()=>{if(inp.value==='@'){inp.value='';pickTarget($('#to-chip'));}S.typing=inp.value.length>0;renderHead();renderTo();inp.style.height='auto';inp.style.height=Math.min(120,inp.scrollHeight)+'px';});
  inp.addEventListener('blur',()=>{S.typing=false;renderHead();});
  const send=()=>{const v=inp.value.trim();if(!v)return;inp.value='';inp.style.height='auto';inp.placeholder='说你想做什么，或者问我';S.typing=false;handleUserMessage(v);};
  inp.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const r=preRoute(inp.value);const ids=[null,...(r.hits||[]).map(h=>h.id)];if(ids.length===1)ids.push(focusThread().id);const i=ids.indexOf(S.target);S.target=ids[(i+1)%ids.length];renderTo();return;}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  $('#send').addEventListener('click',send);
  $('#to-chip').addEventListener('click',e=>{if(S.target&&e.target.classList.contains('x')){S.target=null;renderTo();return;}pickTarget(e.currentTarget);});
  $('#status').addEventListener('click',()=>toggleSheet());
  $('#plus').addEventListener('click',()=>popMenu($('#plus-menu'),[el('button',{type:'button',onclick:()=>toast('附件（示例）')},svg(IC.clip),'附件'),el('button',{type:'button',onclick:()=>toast('语音输入（第 114 波）')},svg(IC.mic),'语音'),el('button',{type:'button',onclick:()=>{$('#plus-menu').classList.add('hidden');openPalette('target');}},svg(IC.search),'指定线程（或直接输入 @）')]));
  $('#perm-btn').addEventListener('click',()=>popMenu($('#perm-pop'),[el('div',{class:'hd'},'新线程默认权限'),...PERMS.map(p=>el('button',{class:'opt',type:'button',role:'menuitemradio','aria-checked':String(S.defaultPerm===p),onclick:()=>{$('#perm-pop').classList.add('hidden');if(p==='全自动'){confirmFull(()=>{S.defaultPerm=p;renderAll();msgSys('新线程默认权限：全自动');});return;}S.defaultPerm=p;renderAll();msgSys('新线程默认权限：'+p);}},svg(IC.shield),el('b',{},p),el('small',{},PERM_DESC[p])))]));
  $('#stop-btn').addEventListener('click',toggleSleep);
  $('#avatar').addEventListener('click',e=>{floatMenu(e.currentTarget,[...[['settings','设置',IC.gear],['memory','记得的关于你',IC.mem],['ledger','行动流水',IC.clock],['schedule','定时任务',IC.clock],['health','体检',IC.ok]].map(([k,l])=>({label:l,on:()=>openPanel(k)})),{label:'找线程  Ctrl+K',on:()=>openPalette()},{label:'切到 2.0 经典壳',on:()=>openClassic(S.drawer||'t1',true)},{label:'细节：工具轨迹（专家）',checked:$('#app').classList.contains('details'),on:()=>$('#app').classList.toggle('details')}]);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').firstChild){closePanel();return;}if(document.querySelector('.menu.float')){document.querySelectorAll('.menu.float').forEach(n=>n.remove());return;}if($('#classic-host').firstChild){closeClassic();return;}if($('#sheet-host').firstChild){toggleSheet(false);return;}if(S.drawer){closeDrawer();return;}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();}});
  $('#d-theme').addEventListener('click',()=>{const h=document.documentElement;const cur=h.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const n=cur==='dark'?'light':'dark';h.dataset.theme=n;$('#d-theme').textContent=n==='dark'?'切到浅色':'切到深色';});
  $('#d-phone').addEventListener('change',e=>{S.phone=e.target.checked;$('#app').classList.toggle('phone',S.phone);if(S.phone&&S.drawer){S.drawer=null;$('#app').classList.remove('has-drawer');}renderAll();});
  $('#d-rm').addEventListener('change',e=>document.documentElement.classList.toggle('rm',e.target.checked));
  $('#d-dock').addEventListener('change',e=>{S.dock=e.target.checked;S.dockDismissed=false;if(!S.dock&&S.drawer){S.drawer=null;$('#app').classList.remove('has-drawer');}renderAll();});
  $('#d-sat').addEventListener('change',e=>{S.sat=e.target.checked;renderHead();});
  $('#d-av').addEventListener('change',e=>{S.forced=e.target.value;renderHead();});
  $('#d-evt').addEventListener('change',e=>{const v=e.target.value;e.target.value='';if(v)simulate(v);});
  $('#d-board').addEventListener('click',()=>toggleSheet());
  $('#d-visit').addEventListener('click',()=>{visit(false);renderAll();toast('上次的对话已归档进行动流水，这次只汇报');});
  $('#d-play').addEventListener('click',play);
  $('#d-reset').addEventListener('click',()=>{S=freshState();S.sat=$('#d-sat').checked;S.dock=$('#d-dock').checked;S.phone=$('#d-phone').checked;closePanel();closeClassic();toggleSheet(false);S.drawer=null;$('#app').classList.remove('has-drawer');visit(true);renderAll();renderTo();});
}
S=freshState();bind();visit(true);renderAll();renderTo();
})();
</script>
